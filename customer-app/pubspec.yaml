name: azberry_customer
description: AzBerry — تطبيق الزبون لطلب العصائر والمشروبات
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # UI / utils
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

# App launcher icons — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false # no ios/ folder yet; generate on a Mac after `flutter create . --platforms ios`
  image_path: "assets/icon/ic_source.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/ic_foreground.png"
  web:
    generated: true
    background_color: "#16A34A"
    theme_color: "#16A34A"
